name: CI
on:
  push:
  pull_request:

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias CPU para tests sin pesos
        run: python -m pip install -e '.[dev]'
      - name: Detectar conflictos de dependencias
        run: python -m pip check
      - name: Lint Python
        run: python -m ruff check src tests
      - name: Pruebas del núcleo y API (sin inferencia GPU)
        run: python -m pytest -q
  typescript-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias frontend
        run: npm ci
      - name: Comprobar TS y compilar UI
        run: npm run build
# Gating GPU/Blackwell necesita un runner autoservido RTX5060Ti: fase 0 pendiente.
